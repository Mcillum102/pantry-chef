name: Supabase keep-alive

# Free Supabase projects pause after ~7 days without activity.
# This sends one lightweight REST request every 3 days so the database sees traffic.
# Requires repository secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (public values, no service key).

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets."
            exit 1
          fi
          # Anonymous users have no table access, so this returns 401/403 and exposes no data,
          # but the request still reaches PostgREST and Postgres.
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/households?select=id&limit=1")
          echo "Supabase responded with HTTP $status"
          if [ "$status" = "000" ] || [ "$status" -ge 500 ]; then
            echo "::error::Supabase did not respond normally (HTTP $status). The project may be paused."
            exit 1
          fi
